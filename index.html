<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kamurocho - Warm Street Edition</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; }
        
        #instructions {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
            color: rgba(255, 200, 150, 0.8); /* Teks agak oranye */
            font-family: sans-serif;
            font-size: 14px;
            pointer-events: none;
            letter-spacing: 2px;
            text-shadow: 0 0 5px #000;
        }

        #loading {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #ffaa00; 
            font-family: monospace; 
            font-size: 18px;
            z-index: 20;
        }
    </style>
</head>
<body>
    <div id="loading">MEMUAT KOTA...</div>
    
    <div id="instructions">
        KLIK LAYAR | WASD: JALAN | SHIFT: LARI | F: TERBANG
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

        let camera, scene, renderer, controls, composer;
        
        let prevTime = performance.now();
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        const walkSpeed = 15.0, runSpeed = 40.0;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let moveUp = false, moveDown = false; 
        let isFreeCam = false;

        init();
        animate();

        function init() {
            // 1. SCENE
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020205); // Langit Hampir Hitam
            
            // Fog sangat tipis berwarna gelap untuk menyatukan jarak pandang
            scene.fog = new THREE.FogExp2(0x020205, 0.002); 

            // 2. KAMERA
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
            camera.position.y = 1.6;

            // 3. LIGHTING (REVISI: WARM STREET SETUP)

            // A. Hemisphere Light (Paling Penting untuk Aspal Warm)
            // SkyColor (Atas): Biru Tua Gelap (Malam)
            // GroundColor (Bawah): Oranye/Coklat Hangat (Pantulan Lampu Jalan)
            // Intensitas 2.5 agar jalanan terlihat jelas (medium intensity) tapi tidak silau.
            const hemiLight = new THREE.HemisphereLight(0x000033, 0x553311, 2.5);
            hemiLight.position.set(0, 50, 0);
            scene.add(hemiLight);

            // B. Directional Light 1 (Moonlight - Cool)
            // Memberikan highlight biru di atap gedung (kontras dingin)
            const moonLight = new THREE.DirectionalLight(0xaaccff, 0.5); 
            moonLight.position.set(-50, 100, -50);
            moonLight.castShadow = true;
            moonLight.shadow.mapSize.width = 4096;
            moonLight.shadow.mapSize.height = 4096;
            scene.add(moonLight);

            // C. Directional Light 2 (Street Ambience - Warm)
            // Cahaya tambahan dari sudut rendah berwarna oranye untuk mengisi bayangan
            // Memberikan kesan "kota penuh lampu sodium/kuning"
            const streetFill = new THREE.DirectionalLight(0xffaa66, 0.5);
            streetFill.position.set(50, 30, 50);
            scene.add(streetFill);

            // 4. RENDERER
            renderer = new THREE.WebGLRenderer({ antialias: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            // Reinhard Tone Mapping menjaga warna warm tetap kaya (tidak pucat)
            renderer.toneMapping = THREE.ReinhardToneMapping; 
            renderer.toneMappingExposure = 1.1; 
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            // 5. POST-PROCESSING (BLOOM)
            const renderScene = new RenderPass(scene, camera);

            // Bloom diset agar neon tetap menyala, tapi jalanan warm tidak ikut "silau"
            const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
            bloomPass.threshold = 0.8; // Hanya benda sangat terang yang glowing
            bloomPass.strength = 0.7;  // Glow lembut
            bloomPass.radius = 0.4;

            const outputPass = new OutputPass();

            composer = new EffectComposer(renderer);
            composer.addPass(renderScene);
            composer.addPass(bloomPass);
            composer.addPass(outputPass);

            // 6. LOAD MODEL
            const loader = new GLTFLoader();
            loader.load('./Kamurocho.glb', function (gltf) {
                const model = gltf.scene;
                model.scale.set(0.03, 0.03, 0.03); 

                model.traverse(function (child) {
                    if (child.isMesh) {
                        child.castShadow = true;    
                        child.receiveShadow = true; 

                        // --- MATERIAL SETUP ---
                        
                        if (child.material.map) {
                            if (!child.material.emissiveMap) {
                                child.material.emissiveMap = child.material.map;
                            }
                            child.material.emissive = new THREE.Color(0xffffff);
                            // Intensitas neon cukup 1.5.
                            // Karena environment sudah warm, neon tidak perlu terlalu ekstrem.
                            child.material.emissiveIntensity = 1.5; 
                        }

                        // --- JALANAN ASPAL (LOGIKA PENTING) ---
                        if (child.material) {
                            // Roughness agak tinggi (0.4) agar aspal "menangkap" warna warm dari Hemisphere Light
                            // Jika terlalu licin (0.1), dia hanya memantulkan langit yang hitam.
                            child.material.roughness = 0.4; 
                            child.material.metalness = 0.2; // Sedikit kilap saja
                        }
                    }
                });

                scene.add(model);
                document.getElementById('loading').style.display = 'none';
            });

            // 7. CONTROLS
            controls = new PointerLockControls(camera, document.body);
            document.body.addEventListener('click', () => controls.lock());
            
            const onKeyDown = (e) => {
                switch (e.code) {
                    case 'KeyW': moveForward = true; break;
                    case 'KeyA': moveLeft = true; break;
                    case 'KeyS': moveBackward = true; break;
                    case 'KeyD': moveRight = true; break;
                    case 'Space': moveUp = true; break;
                    case 'ShiftLeft': moveDown = true; break; 
                    case 'KeyF': isFreeCam = !isFreeCam; break;
                }
            };
            const onKeyUp = (e) => {
                switch (e.code) {
                    case 'KeyW': moveForward = false; break;
                    case 'KeyA': moveLeft = false; break;
                    case 'KeyS': moveBackward = false; break;
                    case 'KeyD': moveRight = false; break;
                    case 'Space': moveUp = false; break;
                    case 'ShiftLeft': moveDown = false; break;
                }
            };
            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
                composer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            
            const time = performance.now();
            if (controls.isLocked) {
                const delta = (time - prevTime) / 1000;
                
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;
                velocity.y -= velocity.y * 10.0 * delta;

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                const speed = (moveDown && !isFreeCam) ? runSpeed : walkSpeed; 

                if (moveForward || moveBackward) velocity.z -= direction.z * speed * 20.0 * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * speed * 20.0 * delta;

                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);
                
                if (isFreeCam) {
                    if (moveUp) velocity.y += speed * 20.0 * delta; 
                    if (moveDown) velocity.y -= speed * 20.0 * delta; 
                    controls.getObject().position.y += velocity.y * delta;
                } else {
                    controls.getObject().position.y = 1.6;
                }
            }
            prevTime = time;
            composer.render();
        }
    </script>
</body>
</html>
